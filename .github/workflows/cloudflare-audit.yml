name: Cloudflare Production Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit humanparadigm.org production
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      CF_ZONE_NAME: humanparadigm.org
      CF_PAGES_PROJECT: human-paradigm-site

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify audit configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CF_API_TOKEN:-}" ]]; then
            echo "CLOUDFLARE_API_TOKEN is not configured in GitHub Actions secrets." >&2
            exit 1
          fi
          if [[ -z "${CF_ACCOUNT_ID:-}" ]]; then
            echo "CLOUDFLARE_ACCOUNT_ID is not configured in GitHub Actions repository variables." >&2
            exit 1
          fi
          if [[ -z "${CF_ZONE_ID:-}" ]]; then
            echo "CLOUDFLARE_ZONE_ID is not configured in GitHub Actions repository variables." >&2
            exit 1
          fi

      - name: Inventory Cloudflare production configuration
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cloudflare-audit

          cf_get() {
            local path="$1"
            local output="$2"
            local status
            status="$(curl --silent --show-error \
              --retry 2 --retry-delay 2 \
              --output "$output" \
              --write-out '%{http_code}' \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4${path}")"
            if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then
              echo "Cloudflare API request failed (${status}) for ${path}" >&2
              jq '{success, errors, messages}' "$output" >&2 2>/dev/null || cat "$output" >&2
              exit 1
            fi
            if ! jq -e '.success == true' "$output" >/dev/null; then
              echo "Cloudflare API returned success=false for ${path}" >&2
              jq '{success, errors, messages}' "$output" >&2 || cat "$output" >&2
              exit 1
            fi
          }

          # Use explicit IDs because this workflow uses an account-owned API token.
          # Avoid global account/zone discovery endpoints that may not be compatible
          # with account-owned token policies.
          cf_get "/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PAGES_PROJECT}" cloudflare-audit/pages-project.json
          cf_get "/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PAGES_PROJECT}/deployments?per_page=25" cloudflare-audit/pages-deployments.json
          cf_get "/zones/${CF_ZONE_ID}/dns_records?per_page=500" cloudflare-audit/dns-records-raw.json
          cf_get "/zones/${CF_ZONE_ID}/settings" cloudflare-audit/zone-settings.json
          cf_get "/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces?per_page=100" cloudflare-audit/kv-namespaces.json
          cf_get "/accounts/${CF_ACCOUNT_ID}/workers/scripts" cloudflare-audit/workers-scripts.json

          jq '{success, result: [.result[] | {id, type, name, content, proxied, ttl, comment, tags}], result_info}' \
            cloudflare-audit/dns-records-raw.json > cloudflare-audit/dns-records.json
          rm cloudflare-audit/dns-records-raw.json

          jq -n \
            --arg generated_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg zone_name "$CF_ZONE_NAME" \
            --arg zone_id "$CF_ZONE_ID" \
            --arg account_id "$CF_ACCOUNT_ID" \
            --arg project "$CF_PAGES_PROJECT" \
            --slurpfile p cloudflare-audit/pages-project.json \
            --slurpfile d cloudflare-audit/pages-deployments.json \
            --slurpfile dns cloudflare-audit/dns-records.json \
            --slurpfile kv cloudflare-audit/kv-namespaces.json \
            --slurpfile ws cloudflare-audit/workers-scripts.json \
            '{
              generated_at: $generated_at,
              canonical_zone: {
                name: $zone_name,
                id: $zone_id,
                account_id: $account_id
              },
              pages: {
                project_name: $project,
                project: $p[0].result,
                latest_deployments: ($d[0].result | map({
                  id,
                  short_id,
                  project_name,
                  environment,
                  url,
                  created_on,
                  modified_on,
                  latest_stage,
                  deployment_trigger,
                  source
                }))
              },
              dns_record_count: ($dns[0].result | length),
              kv_namespaces: ($kv[0].result | map({id, title, supports_url_encoding})),
              workers_scripts: ($ws[0].result | map({id, created_on, modified_on, etag}))
            }' > cloudflare-audit/audit-summary.json

          LATEST_ID="$(jq -r '.result[0].id // "unknown"' cloudflare-audit/pages-deployments.json)"
          LATEST_ENV="$(jq -r '.result[0].environment // "unknown"' cloudflare-audit/pages-deployments.json)"
          LATEST_URL="$(jq -r '.result[0].url // "unknown"' cloudflare-audit/pages-deployments.json)"
          LATEST_CREATED="$(jq -r '.result[0].created_on // "unknown"' cloudflare-audit/pages-deployments.json)"

          {
            echo "## Cloudflare Production Audit"
            echo ""
            echo "- Zone: \`${CF_ZONE_NAME}\`"
            echo "- Pages project: \`${CF_PAGES_PROJECT}\`"
            echo "- Latest deployment ID: \`${LATEST_ID}\`"
            echo "- Latest deployment environment: \`${LATEST_ENV}\`"
            echo "- Latest deployment URL: \`${LATEST_URL}\`"
            echo "- Latest deployment created: \`${LATEST_CREATED}\`"
            echo "- DNS records inventoried: \`$(jq '.result | length' cloudflare-audit/dns-records.json)\`"
            echo "- KV namespaces inventoried: \`$(jq '.result | length' cloudflare-audit/kv-namespaces.json)\`"
            echo ""
            echo "This workflow performs GET requests only. It does not deploy or modify Cloudflare resources."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Cloudflare audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-production-audit-${{ github.run_id }}
          path: cloudflare-audit/
          if-no-files-found: error
          retention-days: 7
